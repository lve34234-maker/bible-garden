const ROOT = 'bg';
const Store = {
  async getUser(id) { const s = await rtdb.ref(`${ROOT}/users/${id}`).get(); return s.val(); },
  async setUser(id, data) { await rtdb.ref(`${ROOT}/users/${id}`).set(data); },
  async updateUser(id, patch) { await rtdb.ref(`${ROOT}/users/${id}`).update(patch); },
  async allUsers() { const s = await rtdb.ref(`${ROOT}/users`).get(); return s.val() || {}; },

  async getProfile(id) { const s = await rtdb.ref(`${ROOT}/profiles/${id}`).get(); return s.val(); },
  async setProfile(id, p) { await rtdb.ref(`${ROOT}/profiles/${id}`).set(p); },
  async updateProfile(id, patch) { await rtdb.ref(`${ROOT}/profiles/${id}`).update(patch); },
  async allProfiles() { const s = await rtdb.ref(`${ROOT}/profiles`).get(); return s.val() || {}; },

  subscribePosts(cb) {
    const ref = rtdb.ref(`${ROOT}/posts`).orderByChild('createdAt');
    const handler = (snap) => {
      const arr = [];
      snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
      arr.reverse();
      cb(arr);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  },
  async addPost(post) {
    const r = rtdb.ref(`${ROOT}/posts`).push();
    await r.set({ ...post, id: r.key });
    return r.key;
  },
  async deletePost(id) { await rtdb.ref(`${ROOT}/posts/${id}`).remove(); },
  async toggleLike(postId, uid) {
    const ref = rtdb.ref(`${ROOT}/posts/${postId}/likes/${uid}`);
    const s = await ref.get();
    if (s.exists()) await ref.remove(); else await ref.set(true);
  },
  async addComment(postId, comment) {
    const r = rtdb.ref(`${ROOT}/posts/${postId}/comments`).push();
    await r.set({ ...comment, id: r.key });
  },

  async addRecord(id, rec) {
    const r = rtdb.ref(`${ROOT}/records/${id}`).push();
    await r.set(rec);
  },
  async getRecords(id) {
    const s = await rtdb.ref(`${ROOT}/records/${id}`).get();
    const v = s.val() || {};
    return Object.entries(v).map(([k,r]) => ({ id:k, ...r }));
  },

  async getAttendance(id, date) { const s = await rtdb.ref(`${ROOT}/attendance/${id}/${date}`).get(); return s.val(); },
  async setAttendance(id, date) { await rtdb.ref(`${ROOT}/attendance/${id}/${date}`).set(true); },
  async getVoiceCount(id, date) { const s = await rtdb.ref(`${ROOT}/voice/${id}/${date}`).get(); return s.val() || 0; },
  async incVoice(id, date) {
    const cur = await Store.getVoiceCount(id, date);
    await rtdb.ref(`${ROOT}/voice/${id}/${date}`).set(cur+1);
    return cur+1;
  },

  async getFirstPost(id) { const s = await rtdb.ref(`${ROOT}/firstPost/${id}`).get(); return s.val(); },
  async setFirstPost(id) { await rtdb.ref(`${ROOT}/firstPost/${id}`).set(true); },

/* ============================================================
   ✨ Toast & Particles
   ============================================================ */
const ToastCtx = createContext(()=>{});
const useToast = () => useContext(ToastCtx);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = (msg, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2">
        {toasts.map(t => (
          <div key={t.id} className={`toast card px-5 py-3 text-lg font-bold ${t.type==='success' ? 'border-green-400' : t.type==='error' ? 'border-red-400' : ''}`}>
            {t.type==='success' && '🎉 '}{t.type==='error' && '⚠️ '}{t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function fireParticles(x, y) {
  const colors = ['#ffd66b','#ff8fb0','#8bd97a','#b6a3ff','#ffa86b'];
  const root = document.getElementById('root');
  for (let i=0; i<20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:12px;height:12px;border-radius:50%;background:${colors[Math.floor(Math.random()*colors.length)]};z-index:9998;pointer-events:none;`;
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 120;
    p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
    root.appendChild(p);
    setTimeout(()=>p.remove(), 1000);
  }
}

/* ============================================================
   🔑 로그인/회원가입
   ============================================================ */
function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [id, setId] = useState('');
  const [pw, setPw] = useState('');
  const [email, setEmail] = useState('');
  const [busy, setBusy] = useState(false);
  const toast = useToast();

  const doAuth = async () => {
    if (!id || !pw) { toast('아이디와 비밀번호를 입력해줘!', 'error'); return; }
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(id)) { toast('아이디는 영문/숫자 3~20자!', 'error'); return; }
    setBusy(true);
    try {
      if (mode === 'signup') {
        const existing = await Store.getUser(id);
        if (existing) { toast('이미 있는 아이디야!', 'error'); setBusy(false); return; }
        await Store.setUser(id, { id, pw, email, nickname:'', isGoogle:false, createdAt: Date.now() });
        toast('가입 완료! 닉네임을 정해줘 ✨','success');
        onAuth({ id, email, isAdmin: id==='onchurch', needSetup: true });
      } else {
        const u = await Store.getUser(id);
        if (!u || u.pw !== pw) { toast('아이디/비번이 틀려!', 'error'); setBusy(false); return; }
        const prof = await Store.getProfile(id);
        onAuth({ id, email:u.email, nickname:u.nickname, isAdmin: id==='onchurch', needSetup: !prof, profile: prof });
      }
    } catch(e) { toast('오류: '+e.message,'error'); }
    setBusy(false);
  };

  const googleLogin = async () => {
    setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      const fbUser = result.user;
      const gid = 'g_' + fbUser.uid.slice(0,16);
      let u = await Store.getUser(gid);
      if (!u) {
        u = { id:gid, pw:'(구글 로그인)', email: fbUser.email, nickname: fbUser.displayName || '', isGoogle:true, createdAt: Date.now() };
        await Store.setUser(gid, u);
      }
      const prof = await Store.getProfile(gid);
      toast('구글 로그인 성공!','success');
      onAuth({ id:gid, email:fbUser.email, nickname:u.nickname, isAdmin:false, needSetup: !prof, profile: prof });
    } catch (e) {
      if (e.code === 'auth/popup-closed-by-user') toast('로그인 취소됨','error');
      else if (e.code === 'auth/popup-blocked') toast('팝업 차단됨! 허용해줘','error');
      else toast('구글 로그인 실패: '+e.message,'error');
    }
    setBusy(false);
  };

  const resetPw = async () => {
    if (!email) { toast('이메일을 입력해줘','error'); return; }
    setBusy(true);
    const users = await Store.allUsers();
    const found = Object.entries(users).find(([k,v]) => v.email === email && !v.isGoogle);
    if (!found) { toast('해당 이메일 사용자 없음','error'); setBusy(false); return; }
    const [uid] = found;
    const tempPw = 'temp' + Math.random().toString(36).slice(2,8);
    await Store.updateUser(uid, { pw: tempPw });
    toast(`임시 비번: ${tempPw} (꼭 적어둬!)`,'success');
    setBusy(false);
    setMode('login');
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
      <div className="card p-8 w-full max-w-md">
        <div className="text-center mb-6">
          <div className="text-6xl mb-2">🌱</div>
          <h1 className="text-4xl font-bold text-green-700 dark:text-green-300">성경 정원</h1>
          <p className="text-lg opacity-70 mt-1">Bible Garden</p>
        </div>
        {mode !== 'reset' && (
          <>
            <input placeholder="아이디 (영문/숫자)" value={id} onChange={e=>setId(e.target.value)} className="mb-3" />
            <input type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} className="mb-3" />
            {mode === 'signup' && (
              <input type="email" placeholder="이메일 (비번 찾기용)" value={email} onChange={e=>setEmail(e.target.value)} className="mb-3" />
            )}
            <button className="btn-primary w-full mb-3" onClick={doAuth} disabled={busy}>
              {busy ? '...' : (mode==='login' ? '🔓 로그인' : '🌱 가입하기')}
            </button>
            <button className="btn-secondary w-full mb-3" onClick={googleLogin} disabled={busy}>🔍 구글로 로그인</button>
            <div className="flex justify-between text-sm opacity-70">
              <button onClick={()=>setMode(mode==='login'?'signup':'login')}>
                {mode==='login' ? '회원가입' : '로그인'} →
              </button>
              <button onClick={()=>setMode('reset')}>비번 찾기</button>
            </div>
          </>
        )}
        {mode === 'reset' && (
          <>
            <p className="text-sm opacity-70 mb-3">등록한 이메일을 입력하면 임시 비번을 보여줄게!</p>
            <input type="email" placeholder="가입 이메일" value={email} onChange={e=>setEmail(e.target.value)} className="mb-3" />
            <button className="btn-primary w-full mb-3" onClick={resetPw} disabled={busy}>📩 임시 비번 발급</button>
            <button className="text-sm opacity-70" onClick={()=>setMode('login')}>← 로그인으로</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================

   ============================================================ */
function HomePage({ user, setUser }) {
  const toast = useToast();
  const [verse, setVerse] = useState(null);
  const [reading, setReading] = useState(true);
  const [quizIdx, setQuizIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showFeedback, setShowFeedback] = useState(false);
  const p = user.profile;

  useEffect(() => {
    (async () => {
      const todayId = await Store.getTodayVerse();
      const id = (todayId && BIBLE_VERSES.find(v=>v.id===todayId)) ? todayId
        : BIBLE_VERSES[new Date().getDate() % BIBLE_VERSES.length].id;
      const v = { ...BIBLE_VERSES.find(x=>x.id===id) };
      const custom = await Store.getCustomQuizzes(id);
      if (custom) v.quizzes = custom;
      setVerse(v);
    })();
  }, []);

  useEffect(() => {
    const decay = async () => {
      const now = Date.now();
      const elapsed = now - p.lastDecay;
      const ticks = Math.floor(elapsed / (12 * 60 * 60 * 1000));
      if (ticks > 0) {
        const changes = {
          water: Math.max(0, p.water - ticks*5),
          sun: Math.max(0, p.sun - ticks*5),
          lastDecay: p.lastDecay + ticks*(12*60*60*1000)
        };
        await updateProf(changes);
      }
    };
    decay();
    const t = setInterval(decay, 60000);
    return ()=>clearInterval(t);
  }, []);

  const updateProf = async (changes) => {
    const np = { ...p, ...changes };
    setUser(u => ({ ...u, profile: np }));
    await Store.updateProfile(user.id, changes);
  };

  const companions = { plant:'🌱', tree:'🪴', dog:'🐶', cat:'🐱' };
  const startQuiz = () => { setReading(false); setQuizIdx(Math.floor(Math.random() * verse.quizzes.length)); };

  const submitAnswer = async (e) => {
    if (selected === null) return;
    const q = verse.quizzes[quizIdx];
    const correct = selected === q.answer;
    setShowFeedback(true);
    const changes = { totalQ: p.totalQ + 1 };
    if (correct) {
      changes.correctQ = p.correctQ + 1;
      changes.points = p.points + 10;
      changes.water = Math.min(100, p.water + 5);
      changes.sun = Math.min(100, p.sun + 5);
      changes.streak = p.streak + 1;
      changes.bestStreak = Math.max(p.bestStreak, changes.streak);
      const newLvl = Math.min(5, Math.floor(changes.points / 100) + 1);
      changes.level = newLvl;
      if (newLvl > p.level) {
        toast(`레벨업! ⭐ ${newLvl}레벨!`, 'success');
        fireParticles(window.innerWidth/2, window.innerHeight/2);
      }
      toast('정답! +10 포인트 🎉','success');
      const rect = e.target.getBoundingClientRect();
      fireParticles(rect.left + rect.width/2, rect.top + rect.height/2);
      await Store.addRecord(user.id, { verseId:verse.id, q:q.q, correct:true, ts:Date.now() });
    } else {
      changes.streak = 0;
      toast(`아쉽다! 정답: ${q.options[q.answer]}`,'error');
      await Store.addRecord(user.id, { verseId:verse.id, q:q.q, correct:false, ts:Date.now(), selected:q.options[selected], answer:q.options[q.answer] });
    }
    await updateProf(changes);
    setTimeout(() => { setShowFeedback(false); setSelected(null); setReading(true); }, 1500);
  };

  if (!verse) return <div className="p-8 text-center"><span className="loader"></span></div>;
  const q = verse.quizzes[quizIdx];
  const accuracy = p.totalQ ? Math.round(p.correctQ/p.totalQ*100) : 0;

  return (
    <div className="p-6 max-w-3xl mx-auto">
      <div className="card p-5 mb-6">
        <div className="flex items-center gap-4">
          <div className="text-7xl bobble">{companions[p.companion]}</div>
          <div className="flex-1">
            <h2 className="text-2xl font-bold">{p.companionName}</h2>
            <p className="text-sm opacity-70">{user.nickname}님의 친구</p>
            <LevelStars level={p.level} />
            <p className="text-sm mt-1">💎 {p.points}P · 🔥 연속 {p.streak} · 🎯 {accuracy}%</p>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div>
            <p className="text-sm">💧 물 {p.water}/100</p>
            <div className="progress"><div className="progress-fill" style={{width:p.water+'%'}}></div></div>
          </div>
          <div>
            <p className="text-sm">☀️ 햇빛 {p.sun}/100</p>
            <div className="progress"><div className="progress-fill" style={{width:p.sun+'%', background:'linear-gradient(90deg,#ffd66b,#ffa86b)'}}></div></div>
          </div>
        </div>
      </div>
      <div className="card p-6">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-xl font-bold">📖 오늘의 말씀</h3>
          <span className="text-sm opacity-70">{verse.ref}</span>
        </div>
        {reading ? (
          <>
            <p className="text-xl leading-relaxed bg-yellow-50 dark:bg-yellow-900/30 p-5 rounded-2xl border-2 border-yellow-200 dark:border-yellow-700">"{verse.text}"</p>
            <p className="text-sm opacity-60 mt-3">💡 말씀을 천천히 읽고 문제를 풀어봐!</p>
            <button className="btn-primary w-full mt-4" onClick={startQuiz}>✍️ 퀴즈 풀기</button>
          </>
        ) : (
          <>
            <p className="text-lg mb-4 font-bold">{q.q}</p>
            <div className="grid grid-cols-1 gap-2 mb-4">
              {q.options.map((opt, i) => (
                <button key={i} disabled={showFeedback} onClick={()=>setSelected(i)}
                  className={`p-3 rounded-2xl text-left transition-all border-2 ${
                    selected===i
                      ? showFeedback
                        ? i===q.answer ? 'bg-green-200 border-green-500' : 'bg-red-200 border-red-500'
                        : 'bg-blue-100 border-blue-400'
                      : 'bg-white dark:bg-white/5 border-gray-200'
                  }`}>
                  {String.fromCharCode(65+i)}. {opt}
                </button>
              ))}
            </div>
            <button className="btn-primary w-full" disabled={selected===null || showFeedback} onClick={submitAnswer}>제출</button>
            <button className="btn-secondary w-full mt-2" onClick={()=>{setReading(true);setSelected(null);}}>← 말씀 다시 읽기</button>
          </>
        )}
      </div>
      <VoiceCert user={user} updateProf={updateProf} />
    </div>
  );
}

/* ============================================================
   🎙️ 음성 인증
   ============================================================ */
function VoiceCert({ user, updateProf }) {
  const toast = useToast();
  const [recording, setRecording] = useState(false);
  const [audioURL, setAudioURL] = useState(null);
  const [used, setUsed] = useState(0);
  const mediaRef = useRef(null);
  const chunksRef = useRef([]);
  const today = new Date().toISOString().slice(0,10);
  useEffect(() => { Store.getVoiceCount(user.id, today).then(setUsed); }, []);
  const start = async () => {
    if (used >= 3) { toast('오늘 인증은 다 했어! 내일 또 보자','error'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const mr = new MediaRecorder(stream);
      mediaRef.current = mr; chunksRef.current = [];
      mr.ondataavailable = e => chunksRef.current.push(e.data);
      mr.onstop = () => { const blob = new Blob(chunksRef.current, { type:'audio/webm' }); setAudioURL(URL.createObjectURL(blob)); };
      mr.start(); setRecording(true);
    } catch (e) { toast('마이크 권한이 필요해!','error'); }
  };
  const stop = () => { mediaRef.current?.stop(); mediaRef.current?.stream.getTracks().forEach(t=>t.stop()); setRecording(false); };
  const confirm = async () => {
    const newUsed = await Store.incVoice(user.id, today);
    setUsed(newUsed);
    await updateProf({ points: user.profile.points + 10 });
    setAudioURL(null);
    toast('인증 완료! +10P 🎙️','success');
    fireParticles(window.innerWidth/2, window.innerHeight/2);
  };
  return (
    <div className="card p-5 mt-6">
      <h3 className="text-xl font-bold mb-2">🎙️ 성경 읽기 녹음 인증</h3>
      <p className="text-sm opacity-70 mb-3">오늘 인증: {used}/3</p>
      {!recording && !audioURL && <button className="btn-primary" onClick={start} disabled={used>=3}>🔴 녹음 시작</button>}
      {recording && <button className="btn-primary" onClick={stop} style={{background:'#ff7a7a'}}>⏹️ 녹음 종료</button>}
      {audioURL && (
        <div className="flex flex-col gap-2 items-start">
          <audio src={audioURL} controls />
          <div className="flex gap-2">
            <button className="btn-primary" onClick={confirm}>✅ 인증 제출</button>
            <button className="btn-secondary" onClick={()=>setAudioURL(null)}>🔄 다시</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   🌿 커뮤니티 (실시간)
   ============================================================ */
function CommunityPage({ user, setUser }) {
  const toast = useToast();
  const [posts, setPosts] = useState([]);
  const [text, setText] = useState('');
  const [image, setImage] = useState(null);
  const [openComments, setOpenComments] = useState({});
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const unsub = Store.subscribePosts(setPosts);
    return unsub;
  }, []);

  const submit = async () => {
    if (!text.trim() && !image) { toast('내용이나 사진을 넣어줘!','error'); return; }
    setBusy(true);
    try {
      const post = {
        authorId: user.id, authorName: user.nickname,
        text: text || '', image: image || null,
        likes: {}, comments: {}, createdAt: Date.now()
      };
      await Store.addPost(post);
      const isFirst = !(await Store.getFirstPost(user.id));
      if (isFirst) {
        await Store.setFirstPost(user.id);
        const np = { ...user.profile, points: user.profile.points + 10 };
        setUser(u=>({...u, profile:np}));
        await Store.updateProfile(user.id, { points: np.points });
        toast('첫 게시글! +10P 🌸','success');
        fireParticles(window.innerWidth/2, 200);
      } else { toast('게시 완료!','success'); }
      setText(''); setImage(null);
    } catch(e) { toast('등록 실패: '+e.message,'error'); }
    setBusy(false);
  };

  const onFile = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 2000000) { toast('2MB 이하 이미지만!','error'); return; }
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      setImage(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = URL.createObjectURL(f);
  };

  const toggleLike = (postId) => Store.toggleLike(postId, user.id);
  const addComment = async (postId, cText) => {
    if (!cText.trim()) return;
    await Store.addComment(postId, { authorId: user.id, authorName: user.nickname, text: cText, createdAt: Date.now() });
  };
  const deletePost = async (postId) => {
    if (!confirm('정말 삭제할까?')) return;
    await Store.deletePost(postId);
    toast('삭제됐어','success');
  };
  const sharePost = (post) => {
    const txt = `[성경 정원] ${post.authorName}: ${post.text}`;
    if (navigator.share) navigator.share({ text:txt });
    else { navigator.clipboard.writeText(txt); toast('링크 복사됨!','success'); }
  };

  return (
    <div className="p-6 max-w-2xl mx-auto">
      <h2 className="text-3xl font-bold mb-4">🌿 커뮤니티</h2>
      <div className="card p-4 mb-6">
        <textarea rows={3} placeholder="오늘의 묵상을 나눠봐..." value={text} onChange={e=>setText(e.target.value)} className="mb-2" />
        {image && (
          <div className="relative mb-2">
            <img src={image} className="rounded-2xl max-h-64 object-cover w-full" />
            <button className="absolute top-2 right-2 bg-black/50 text-white w-8 h-8 rounded-full" onClick={()=>setImage(null)}>✕</button>
          </div>
        )}
        <div className="flex gap-2">
          <label className="btn-secondary cursor-pointer flex-1 text-center">
            📷 사진
            <input type="file" accept="image/*" onChange={onFile} className="hidden" />
          </label>
          <button className="btn-primary flex-1" onClick={submit} disabled={busy}>📤 게시</button>
        </div>
      </div>
      {posts.length===0 && <p className="text-center opacity-60 py-10">아직 게시글이 없어. 첫 게시글을 써보자! 🌱</p>}
      {posts.map(post => (
        <PostCard key={post.id} post={post} user={user}
          onLike={()=>toggleLike(post.id)}
          onComment={(t)=>addComment(post.id,t)}
          onDelete={()=>deletePost(post.id)}
          onShare={()=>sharePost(post)}
          open={openComments[post.id]}
          toggleOpen={()=>setOpenComments(o=>({...o,[post.id]:!o[post.id]}))}
        />
      ))}
    </div>
  );
}

function timeAgo(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff/60)+'분 전';
  if (diff < 86400) return Math.floor(diff/3600)+'시간 전';
  return Math.floor(diff/86400)+'일 전';
}

function PostCard({ post, user, onLike, onComment, onDelete, onShare, open, toggleOpen }) {
  const [cText, setCText] = useState('');
  const likes = post.likes ? Object.keys(post.likes) : [];
  const comments = post.comments ? Object.values(post.comments).sort((a,b)=>a.createdAt-b.createdAt) : [];
  const liked = likes.includes(user.id);
  const visibleComments = open ? comments : comments.slice(0,2);
  return (
    <div className="card p-4 mb-4">
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="font-bold">{post.authorName}</div>
          <div className="text-xs opacity-60">{timeAgo(post.createdAt)}</div>
        </div>
        {(post.authorId === user.id || user.isAdmin) && (
          <button onClick={onDelete} className="text-sm opacity-60 hover:opacity-100">🗑️ 삭제</button>
        )}
      </div>
      {post.image && <img src={post.image} className="rounded-2xl w-full max-h-96 object-cover mb-2" />}
      {post.text && <p className="mb-3 whitespace-pre-wrap">{post.text}</p>}
      <div className="flex gap-4 text-sm border-t pt-2">
        <button onClick={onLike}>{liked?'❤️':'🤍'} {likes.length}</button>
        <button onClick={toggleOpen}>💬 {comments.length}</button>
        <button onClick={onShare}>↗️ 공유</button>
      </div>
      {comments.length > 0 && (
        <div className="mt-2 space-y-1">
          {visibleComments.map(c => (
            <div key={c.id} className="text-sm">
              <b>{c.authorName}</b> {c.text} <span className="opacity-50">· {timeAgo(c.createdAt)}</span>
            </div>
          ))}
          {!open && comments.length > 2 && (
            <button onClick={toggleOpen} className="text-xs opacity-60">전체 댓글 {comments.length}개 보기</button>
          )}
        </div>
      )}
      <div className="flex gap-2 mt-2">
        <input placeholder="댓글 달기..." value={cText} onChange={e=>setCText(e.target.value)} className="flex-1" />
        <button className="btn-primary px-3" onClick={()=>{onComment(cText); setCText('');}}>↩</button>
      </div>
    </div>
  );
}

function SettingsPage({ user, setUser, dark, setDark, font, setFont, onLogout }) {
  const toast = useToast();
  const [newNick, setNewNick] = useState(user.nickname);
  const [oldPw, setOldPw] = useState('');
  const [newPw, setNewPw] = useState('');
  const [email, setEmail] = useState('');
  const [scanning, setScanning] = useState(false);
  const videoRef = useRef(null);
  const scanningRef = useRef(false);
  const p = user.profile;
  const acc = p.totalQ ? Math.round(p.correctQ/p.totalQ*100) : 0;
  const fonts = [
    { id:'gaegu',  label:'🌱 Gaegu (기본)', cls:'font-gaegu' },
    { id:'jua',    label:'🍡 Jua',         cls:'font-jua' },
    { id:'do',     label:'📌 Do Hyeon',    cls:'font-do' },
    { id:'han',    label:'⚡ Black Han',   cls:'font-han' },
    { id:'pen',    label:'✏️ 나눔펜',       cls:'font-pen' },
    { id:'sun',    label:'🌻 Sunflower',   cls:'font-sun' },
    { id:'single', label:'🌸 Single Day',  cls:'font-single' },
  ];
  const saveNick = async () => {
    if (!newNick.trim()) return;
    await Store.updateUser(user.id, { nickname: newNick });
    setUser(u => ({ ...u, nickname: newNick }));
    toast('닉네임 변경됨!','success');
  };
  const savePw = async () => {
    const u = await Store.getUser(user.id);
    if (!u || u.pw !== oldPw) { toast('기존 비번이 틀려','error'); return; }
    await Store.updateUser(user.id, { pw: newPw });
    toast('비번 변경됨!','success');
    setOldPw(''); setNewPw('');
  };
  const saveEmail = async () => { await Store.updateUser(user.id, { email }); toast('이메일 등록됨','success'); };
  const setDarkAndSave = async (v) => { setDark(v); await Store.setUserSettings(user.id, { dark: v }); };
  const setFontAndSave = async (v) => { setFont(v); await Store.setUserSettings(user.id, { font: v }); };
  const scanQR = async () => {
    setScanning(true);
    scanningRef.current = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment'} });
      videoRef.current.srcObject = stream;
      await videoRef.current.play();
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const tick = () => {
        if (!scanningRef.current) return;
        if (videoRef.current && videoRef.current.readyState === 4) {
          canvas.width = videoRef.current.videoWidth;
          canvas.height = videoRef.current.videoHeight;
          ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if (code && code.data.startsWith('BG_ATTENDANCE')) {
            stopScan();
            (async () => {
              const today = new Date().toISOString().slice(0,10);
              const has = await Store.getAttendance(user.id, today);
              if (has) { toast('오늘은 이미 출석했어!','error'); return; }
              await Store.setAttendance(user.id, today);
              const np = { ...p, points: p.points + 10 };
              setUser(u=>({...u,profile:np}));
              await Store.updateProfile(user.id, { points: np.points });
              toast('출석 완료! +10P 🎊','success');
              fireParticles(window.innerWidth/2, window.innerHeight/2);
            })();
            return;
          }
        }
        requestAnimationFrame(tick);
      };
      tick();
    } catch(e) { toast('카메라 권한이 필요해','error'); setScanning(false); scanningRef.current = false; }
  };
  const stopScan = () => {
    scanningRef.current = false;
    setScanning(false);
    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t=>t.stop());
  };
  return (
    <div className="p-6 max-w-2xl mx-auto">
      <h2 className="text-3xl font-bold mb-4">⚙️ 설정 & 마이페이지</h2>
      <div className="card p-5 mb-6">
        <h3 className="text-xl font-bold mb-3">👤 내 정보</h3>
        <div className="grid grid-cols-2 gap-3 text-center">
          <div><div className="text-2xl font-bold">{p.points}</div><div className="text-sm opacity-70">💎 포인트</div></div>
          <div className="flex flex-col items-center"><LevelStars level={p.level} /><div className="text-sm opacity-70">⭐ 레벨</div></div>
          <div><div className="text-2xl font-bold">{acc}%</div><div className="text-sm opacity-70">🎯 정답률</div></div>
          <div><div className="text-2xl font-bold">{p.bestStreak||0}</div><div className="text-sm opacity-70">🔥 최고 연속</div></div>
        </div>
      </div>
      <div className="card p-5 mb-4">
        <h3 className="text-xl font-bold mb-3">🌓 화면 모드</h3>
        <div className="flex gap-2">
          <button onClick={()=>setDarkAndSave(false)} className={!dark?'btn-primary':'btn-secondary'}>☀️ 라이트</button>
          <button onClick={()=>setDarkAndSave(true)} className={dark?'btn-primary':'btn-secondary'}>🌙 다크</button>
        </div>
      </div>
      <div className="card p-5 mb-4">
        <h3 className="text-xl font-bold mb-3">✍️ 글꼴 (7가지)</h3>
        <div className="grid grid-cols-2 gap-2">
          {fonts.map(f => (
            <button key={f.id} onClick={()=>setFontAndSave(f.id)}
              className={`${f.cls} p-3 rounded-2xl border-2 text-lg ${font===f.id?'border-green-500 bg-green-50 dark:bg-green-900/30':'border-gray-200'}`}>
              {f.label}
            </button>
          ))}
        </div>
      </div>
      <div className="card p-5 mb-4">
        <h3 className="text-xl font-bold mb-3">🪪 계정 관리</h3>
        <label className="text-sm font-bold">닉네임</label>
        <div className="flex gap-2 mb-3">
          <input value={newNick} onChange={e=>setNewNick(e.target.value)} />
          <button className="btn-primary" onClick={saveNick}>저장</button>
        </div>
        <label className="text-sm font-bold">비밀번호 변경</label>
        <input type="password" placeholder="기존 비번" value={oldPw} onChange={e=>setOldPw(e.target.value)} className="mb-2" />
        <input type="password" placeholder="새 비번" value={newPw} onChange={e=>setNewPw(e.target.value)} className="mb-2" />
        <button className="btn-primary mb-4 w-full" onClick={savePw}>비번 바꾸기</button>
        <label className="text-sm font-bold">이메일 등록 (비번 찾기용)</label>
        <div className="flex gap-2">
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} />
          <button className="btn-primary" onClick={saveEmail}>저장</button>
        </div>
      </div>
      <div className="card p-5 mb-4">
        <h3 className="text-xl font-bold mb-3">📷 출석 QR 스캔 (+10P)</h3>
        {!scanning && <button className="btn-primary" onClick={scanQR}>📸 카메라 열기</button>}
        {scanning && (
          <div>
            <video ref={videoRef} className="w-full rounded-2xl mb-2" />
            <button className="btn-secondary" onClick={stopScan}>닫기</button>
          </div>
        )}
      </div>
      <button className="btn-secondary w-full" onClick={onLogout}>🚪 로그아웃</button>
    </div>
  );
}

              <th className="p-2">닉네임</th>
              <th className="p-2">비밀번호</th>
              <th className="p-2">포인트</th>
              <th className="p-2">레벨</th>
              <th className="p-2">정답률</th>
            </tr>
          </thead>
          <tbody>
            {list.map(u => (
              <tr key={u.id} className="border-b">
                <td className="p-2 font-bold">{u.id}</td>
                <td className="p-2">{u.nickname || '-'}</td>
                <td className="p-2 cursor-pointer" onClick={()=>setShowPw(s=>({...s,[u.id]:!s[u.id]}))}>
                  {showPw[u.id] ? (u.pw || '(구글)') : '••••••'}
                </td>
                <td className="p-2">{u.profile?.points || 0}P</td>
                <td className="p-2">{u.profile?.level || 1}</td>
                <td className="p-2">{u.profile?.totalQ ? Math.round(u.profile.correctQ/u.profile.totalQ*100)+'%' : '-'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ContentManager() {
  const toast = useToast();
  const [selected, setSelected] = useState(BIBLE_VERSES[0].id);
  const [quizzes, setQuizzes] = useState(BIBLE_VERSES[0].quizzes);
  const [todayId, setTodayId] = useState('');
  useEffect(() => { Store.getTodayVerse().then(v => v && setTodayId(v)); }, []);
  useEffect(() => {
    (async () => {
      const custom = await Store.getCustomQuizzes(selected);
      const verse = BIBLE_VERSES.find(v=>v.id===selected);
      setQuizzes(JSON.parse(JSON.stringify(custom || verse.quizzes)));
    })();
  }, [selected]);
  const saveToday = async () => { await Store.setTodayVerse(selected); setTodayId(selected); toast('오늘의 말씀 설정됨','success'); };
  const updateQuiz = (i, field, val) => {
    const nq = [...quizzes];
    if (field === 'q') nq[i] = {...nq[i], q:val};
    if (field === 'answer') nq[i] = {...nq[i], answer:parseInt(val)};
    setQuizzes(nq);
  };
  const updateOption = (i, oi, val) => {
    const nq = [...quizzes];
    nq[i] = {...nq[i], options:[...nq[i].options]};
    nq[i].options[oi] = val;
    setQuizzes(nq);
  };
  const saveQuizzes = async () => { await Store.setCustomQuizzes(selected, quizzes); toast('퀴즈 저장됨!','success'); };
  const verse = BIBLE_VERSES.find(v=>v.id===selected);
  return (
    <div className="card p-4">
      <h3 className="text-xl font-bold mb-3">📖 오늘의 말씀 & 퀴즈</h3>
      <p className="text-sm opacity-70 mb-2">현재 오늘의 말씀: {todayId ? BIBLE_VERSES.find(v=>v.id===todayId)?.ref : '(자동 선택)'}</p>
      <select value={selected} onChange={e=>setSelected(e.target.value)} className="mb-3">
        {BIBLE_VERSES.map(v => <option key={v.id} value={v.id}>{v.ref} - {v.text.slice(0,30)}...</option>)}
      </select>
      <button className="btn-primary mb-4" onClick={saveToday}>✅ 이걸 오늘의 말씀으로!</button>
      <p className="bg-yellow-50 dark:bg-yellow-900/30 p-3 rounded-2xl mb-3">"{verse.text}"</p>
      <div className="space-y-4">
        {quizzes.map((q,i) => (
          <div key={i} className="border-2 border-gray-200 rounded-2xl p-3">
            <label className="text-sm font-bold">문제 {i+1}</label>
            <input value={q.q} onChange={e=>updateQuiz(i,'q',e.target.value)} className="mb-2" />
            {q.options.map((opt,oi) => (
              <div key={oi} className="flex gap-2 mb-1 items-center">
                <input type="radio" name={`ans-${i}`} checked={q.answer===oi} onChange={()=>updateQuiz(i,'answer',oi)} />
                <input value={opt} onChange={e=>updateOption(i,oi,e.target.value)} />
              </div>
            ))}
          </div>
        ))}
      </div>
      <button className="btn-primary mt-3 w-full" onClick={saveQuizzes}>💾 퀴즈 저장</button>
    </div>
  );
}

function AttendanceQR() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const code = 'BG_ATTENDANCE_' + new Date().toISOString().slice(0,10);
    QRCode.toCanvas(canvasRef.current, code, { width: 280, color:{dark:'#2f3e2c',light:'#ffffff'} });
  }, []);
  return (
    <div className="card p-6 text-center">
      <h3 className="text-xl font-bold mb-3">📷 출석용 QR (오늘)</h3>
      <canvas ref={canvasRef} className="mx-auto rounded-2xl" />
      <p className="text-sm opacity-70 mt-3">회원들이 설정 → 출석 QR 스캔에서 이걸 찍으면 +10P!</p>
    </div>
  );
}

function CommunityModerate({ user }) {
  const toast = useToast();
  const [posts, setPosts] = useState([]);
  useEffect(() => { const unsub = Store.subscribePosts(setPosts); return unsub; }, []);
  const del = async (id) => { if (!confirm('정말 삭제?')) return; await Store.deletePost(id); toast('삭제 완료','success'); };
  return (
    <div className="card p-4">
      <h3 className="text-xl font-bold mb-3">커뮤니티 게시물 ({posts.length}개)</h3>
      {posts.map(p => (
        <div key={p.id} className="border-b py-3 flex justify-between gap-3">
          <div className="flex-1">
            <div className="text-sm opacity-70">{p.authorName} · {timeAgo(p.createdAt)}</div>
            <div className="font-bold">{p.text || '(사진만)'}</div>
          </div>
          <button onClick={()=>del(p.id)} className="text-red-500 font-bold">🗑️ 삭제</button>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   🚀 메인 앱
   ============================================================ */
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('home');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [dark, setDark] = useState(localStorage.getItem('bg_dark') === '1');
  const [font, setFont] = useState(localStorage.getItem('bg_font') || 'gaegu');
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const savedId = localStorage.getItem('bg_lastId');
      if (savedId) {
        try {
          const u = await Store.getUser(savedId);
          if (u) {
            const prof = await Store.getProfile(savedId);
            const settings = await Store.getUserSettings(savedId);
            if (settings.dark !== undefined) setDark(settings.dark);
            if (settings.font) setFont(settings.font);
            setUser({
              id: savedId, email: u.email, nickname: u.nickname,
              isAdmin: savedId === 'onchurch', needSetup: !prof, profile: prof
            });
          }
        } catch(e) { console.error(e); }
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (user && !user.needSetup) localStorage.setItem('bg_lastId', user.id);
  }, [user]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    localStorage.setItem('bg_dark', dark?'1':'0');
  }, [dark]);
  useEffect(() => { localStorage.setItem('bg_font', font); }, [font]);

  const fontClass = { gaegu:'font-gaegu', jua:'font-jua', do:'font-do', han:'font-han', pen:'font-pen', sun:'font-sun', single:'font-single' }[font];

  if (!loaded) return <div className="min-h-screen flex items-center justify-center"><span className="loader"></span></div>;
  if (!user) return <AuthScreen onAuth={u => setUser(u)} />;
  if (user.needSetup) return <SetupScreen user={user} onDone={u => setUser(u)} />;

  const logout = () => {
    localStorage.removeItem('bg_lastId');
    auth.signOut().catch(()=>{});
    setUser(null);
  };

  return (
    <div className={`flex min-h-screen ${fontClass}`}>
      <Sidebar page={page} setPage={setPage} user={user} />
      <header className="md:hidden fixed top-0 inset-x-0 z-30 card rounded-none flex items-center justify-between p-3">
        <button onClick={()=>setMobileOpen(true)} className="text-2xl">☰</button>
        <div className="font-bold text-lg">🌱 성경 정원</div>
        <div className="w-8" />
      </header>
      {mobileOpen && (
        <>
          <div className="fixed inset-0 bg-black/40 z-40" onClick={()=>setMobileOpen(false)}></div>
          <Sidebar page={page} setPage={setPage} user={user} mobile onClose={()=>setMobileOpen(false)} />
        </>
      )}
      <main className="flex-1 relative z-10 pt-16 md:pt-0">
        {page==='home'      && <HomePage user={user} setUser={setUser} />}
        {page==='community' && <CommunityPage user={user} setUser={setUser} />}
        {page==='records'   && <RecordsPage user={user} />}
        {page==='ranking'   && <RankingPage user={user} />}
        {page==='settings'  && <SettingsPage user={user} setUser={setUser} dark={dark} setDark={setDark} font={font} setFont={setFont} onLogout={logout} />}
        {page==='admin' && user.isAdmin && <AdminPanel user={user} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
</html>
